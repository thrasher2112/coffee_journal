version: '3.9'

services:
  api:
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    command: sh -c "alembic upgrade head && python -m coffee_journal.scripts.seed_db && uvicorn coffee_journal.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      - VITE_API_URL=http://localhost:8000

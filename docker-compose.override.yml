version: '3.9'

services:
  api:
    volumes:
      - ./coffee_journal/src:/app/src
      - ./coffee_journal/alembic:/app/alembic
      - ./coffee_journal/alembic.ini:/app/alembic.ini
    command: uvicorn coffee_journal.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      - VITE_API_URL=http://localhost:8000

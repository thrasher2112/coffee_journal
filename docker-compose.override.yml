services:
  api:
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    command: sh -c "alembic upgrade head && python -m coffee_journal.scripts.seed_db && uvicorn coffee_journal.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    volumes:
      - ./frontend:/app
      # Keep the container's node_modules off the bind mount: several deps ship
      # platform-native binaries (rolldown, @tailwindcss/oxide, typescript), and
      # sharing one directory between the Linux container and a Windows/macOS
      # host makes whichever ran `npm install` last clobber the other's binding.
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  web_node_modules:

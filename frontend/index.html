<!doctype html>
<html lang="en" class="bg-night">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real
         values; without it the bottom nav sits under the iOS home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Log every brew - beans, ratios, timings - and find the cups worth repeating." />
    <meta name="theme-color" content="#3b2924" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS ignores the manifest for home-screen installs and reads these instead. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Coffee" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Coffee Journal</title>
  </head>
  <body class="bg-night text-crema">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
